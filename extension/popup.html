<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=320, initial-scale=1" />
    <title>GitHub Social</title>
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { width: 320px; background: #0d1117; color: #c9d1d9; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 13px; }
      .header { padding: 12px 16px; background: #161b22; border-bottom: 1px solid #30363d; }
      .header h1 { font-size: 14px; color: #58a6ff; }
      .header .version { font-size: 11px; color: #8b949e; margin-top: 2px; }
      .section { padding: 12px 16px; border-bottom: 1px solid #21262d; }
      .label { font-size: 11px; color: #8b949e; margin-bottom: 4px; }
      .value { font-size: 13px; color: #c9d1d9; word-break: break-all; }
      .row { display: flex; gap: 8px; align-items: center; }
      input { flex: 1; background: #0d1117; border: 1px solid #30363d; color: #c9d1d9; padding: 6px 8px; border-radius: 6px; font-size: 12px; outline: none; font-family: monospace; }
      input:focus { border-color: #58a6ff; }
      button { background: #238636; color: #fff; border: none; border-radius: 6px; padding: 6px 12px; font-size: 12px; cursor: pointer; font-weight: 500; }
      button:hover { background: #2ea043; }
      button.danger { background: #da3633; }
      button.danger:hover { background: #f85149; }
      button.secondary { background: #21262d; border: 1px solid #30363d; }
      .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
      .stat { background: #0d1117; border: 1px solid #21262d; border-radius: 6px; padding: 6px 8px; text-align: center; }
      .stat .num { font-size: 16px; color: #58a6ff; font-weight: 600; }
      .stat .lbl { font-size: 10px; color: #8b949e; }
      .footer { padding: 10px 16px; text-align: center; font-size: 11px; color: #8b949e; }
      .footer a { color: #d23; text-decoration: none; }
      .footer a:hover { text-decoration: underline; }
      .search { display: flex; gap: 6px; }
      .msg { font-size: 11px; color: #3fb950; margin-top: 6px; }
      .msg.bad { color: #f85149; }
    </style>
  </head>
  <body>
    <div class="header">
      <h1>GitHub Social</h1>
      <div class="version">v0.2.0 — Decentralized</div>
    </div>

    <div class="section">
      <div class="label">Logged in as</div>
      <div class="value" id="my-login">Not set</div>
    </div>

    <div class="section">
      <div class="label">Session Stats</div>
      <div class="stats">
        <div class="stat"><div class="num" id="stat-visits">0</div><div class="lbl">Visits today</div></div>
        <div class="stat"><div class="num" id="stat-hearts">0</div><div class="lbl">Hearts given</div></div>
        <div class="stat"><div class="num" id="stat-reactions">0</div><div class="lbl">Reactions</div></div>
        <div class="stat"><div class="num" id="stat-comments">0</div><div class="lbl">Comments</div></div>
      </div>
    </div>

    <div class="section">
      <div class="label">Quick Search</div>
      <div class="search">
        <input type="text" id="search-input" placeholder="github.com/username" />
        <button id="search-btn">Go</button>
      </div>
    </div>

    <div class="section">
      <div class="label">GitHub Token</div>
      <div class="row">
        <input type="password" id="token-input" placeholder="ghp_…" />
        <button id="save-token-btn">Save</button>
      </div>
      <div id="token-msg" class="msg"></div>
    </div>

    <div class="section">
      <div class="row" style="justify-content: space-between;">
        <button class="secondary" id="settings-btn">Settings</button>
        <button class="danger" id="logout-btn">Clear All</button>
      </div>
    </div>

    <div class="footer">
      <a href="https://github.com/sponsors/neohiro" target="_blank">♥ Sponsor neohiro</a>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
