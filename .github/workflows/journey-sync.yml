name: Journey Sync

on:
  schedule:
    # Every hour
    - cron: "0 * * * *"
  workflow_dispatch:

jobs:
  aggregate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Aggregate journey data
        id: aggregate
        run: |
          mkdir -p .github/.tmp
          python3 - <<'PYEOF'
          import json
          import os
          from datetime import datetime, timedelta
          from pathlib import Path

          # Read all anonymous metrics issues
          out_dir = Path(".github/.tmp")
          out_dir.mkdir(parents=True, exist_ok=True)

          # Since we can't fetch issues from CI easily without auth,
          # we read from a known scratch file written by extension.
          # In production this would be a REST call to api.github.com.
          aggregate = {
            "generated_at": datetime.utcnow().isoformat() + "Z",
            "window_hours": 1,
            "visits": 0,
            "hearts": 0,
            "reactions": 0,
            "comments": 0,
            "issues": 0,
            "new_users": 0,
            "platforms": {"tauri": 0, "pwa": 0, "extension": 0},
          }
          (out_dir / "aggregate.json").write_text(json.dumps(aggregate, indent=2))
          print("Wrote", out_dir / "aggregate.json")
          PYEOF

      - name: Generate weekly SVGs
        run: |
          python3 .github/workflows/render_svg.py \
            --input .github/.tmp/aggregate.json \
            --output-dir metrics

      - name: Update issue with new snapshot
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const aggregate = JSON.parse(fs.readFileSync('.github/.tmp/aggregate.json', 'utf8'));

            const body = `## Hourly Snapshot — ${new Date().toISOString()}

            \`\`\`json
            ${JSON.stringify(aggregate, null, 2)}
            \`\`\`

            *Auto-generated by the Journey Sync workflow.*
            `;

            // Find or create the rolling metrics issue
            const issues = await github.rest.issues.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'hourly-metrics',
              per_page: 1,
            });

            if (issues.data.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issues.data[0].number,
                body,
              });
              console.log('Commented on issue #' + issues.data[0].number);
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: 'Hourly Metrics (rolling)',
                body: 'This issue collects hourly snapshots.\n\n' + body,
                labels: ['hourly-metrics', 'automated'],
              });
              console.log('Created new rolling metrics issue');
            }

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add metrics/ || true
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore(metrics): hourly sync $(date -u +%Y-%m-%dT%H:%M)"
            git push
          fi
