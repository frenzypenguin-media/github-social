name: PWA Deploy

# Builds the PWA from github-social/ and deploys the output to
# frenzypenguin-media.github.io/github-social/ (GitHub Pages).
#
# Flow:
#   1. Check out github-social (source)
#   2. npm install + npm run build:pwa  →  dist-pwa/
#   3. Check out frenzypenguin-media.github.io (target site)
#   4. rsync/copy dist-pwa/ → frenzypenguin-media.github.io/github-social/
#   5. Commit to frenzypenguin-media.github.io (GitHub Pages serves from main branch)
#
# NOTE: This workflow requires a GITHUB_TOKEN with write access to BOTH repos.
# Set up a GitHub App token or personal access token with `repo` scope on both
# orgs if the default GITHUB_TOKEN only covers the source repo.
#
# GitHub Actions vars/secrets needed:
#   GH_PAGES_TOKEN  — token with write access to frenzypenguin-media.github.io
#                     (not required if GITHUB_TOKEN covers both repos)

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "package.json"
      - "vite.config.ts"
      - ".github/workflows/pwa-deploy.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      # ── 1. Build source ────────────────────────────────────────────────────────
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"

      - name: Install deps
        run: npm ci

      - name: Build PWA
        run: npm run build:pwa

      - name: Build embed (drop-in widget for third-party sites)
        run: npm run build:embed

      - name: Verify dist-pwa exists
        run: |
          if [ ! -d dist-pwa ]; then
            echo "::error::dist-pwa/ not produced — check npm run build:pwa"
            exit 1
          fi
          if [ ! -d dist-embed ]; then
            echo "::error::dist-embed/ not produced — check npm run build:embed"
            exit 1
          fi
          echo "Built PWA files:"
          ls dist-pwa/ | head -20
          echo "Built embed files:"
          ls dist-embed/ | head -20

      # ── 2. Deploy to GitHub Pages site ──────────────────────────────────────────
      - name: Checkout GitHub Pages site
        uses: actions/checkout@v7
        with:
          repository: frenzypenguin-media/frenzypenguin-media.github.io
          path: site-target
          token: ${{ secrets.GH_PAGES_TOKEN || github.token }}
          persist-credentials: false

      - name: Copy PWA build to site
        run: |
          mkdir -p site-target/github-social
          # Remove old PWA output first to handle deletions
          rm -rf site-target/github-social/*
          cp -r dist-pwa/* site-target/github-social/
          # Embed bundles (web component + drop-in script) live at the site root
          # so they can be loaded via a single stable URL:
          #   https://frenzypenguin-media.github.io/embed.js         (ES module)
          #   https://frenzypenguin-media.github.io/embed.iife.js   (IIFE — <script src>)
          # Keep the two formats under distinct filenames. They used to be both
          # copied to github-social/embed.js, so the IIFE was written and then
          # immediately overwritten by the ES module; any consumer loading that
          # path via <script src> got `Unexpected token 'export'`.
          cp dist-embed/embed.js      site-target/embed.js
          cp dist-embed/embed.iife.js site-target/embed.iife.js
          cp dist-embed/embed.js      site-target/github-social/embed.js
          cp dist-embed/embed.iife.js site-target/github-social/embed.iife.js
          # GitHub Pages runs Jekyll which strips files starting with `_`.
          # Vite's workbox build outputs hashed assets to `_nuxt/`. Without this
          # file, Jekyll silently deletes the entire PWA JS/CSS cache.
          touch site-target/.nojekyll
          echo "Deployed files:"
          ls site-target/github-social/ | head -20
          echo "Site-root files:"
          for f in embed.js embed.iife.js; do
            if [ -s "site-target/$f" ]; then echo "  $f ok"; else echo "  ::error::$f MISSING"; exit 1; fi
          done

      - name: Commit and push to GitHub Pages
        env:
          # Used for the authenticated push below. NOT passed as GH_TOKEN alone:
          # GH_TOKEN is only read by the `gh` CLI, so a bare `git push` never
          # sees it and dies with "could not read Username for 'https://github.com'".
          PAGES_TOKEN: ${{ secrets.GH_PAGES_TOKEN }}
        run: |
          set -euo pipefail
          cd site-target
          if [ -z "${PAGES_TOKEN:-}" ]; then
            echo "::error title=Missing GH_PAGES_TOKEN::This workflow pushes to"
            echo "::error::frenzypenguin-media/frenzypenguin-media.github.io, a different repo"
            echo "::error::from github-social. The workflow GITHUB_TOKEN is scoped to"
            echo "::error::github-social only and cannot write there. Add a repository"
            echo "::error::secret named GH_PAGES_TOKEN (PAT or GitHub App installation"
            echo "::error::token with 'contents: write' on frenzypenguin-media.github.io)."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Stage the site-root embed bundles too -- they were copied above but
          # never added, so they never reached the deployed site.
          git add github-social/ .nojekyll embed.js embed.iife.js
          if git diff --staged --quiet; then
            echo "No changes to deploy"
          else
            git status --short
            git commit -m "build(pwa): deploy $(date -u +%Y-%m-%dT%H:%M:%S)"
            # Embed the credential in the remote URL for this one push, so git
            # actually has auth. A credential helper or extraheader would instead
            # leave the token in .git/config, where it can leak into later output.
            git push "https://x-access-token:${PAGES_TOKEN}@github.com/frenzypenguin-media/frenzypenguin-media.github.io.git" \
              HEAD:main
            echo "::notice::PWA deployed to frenzypenguin-media.github.io/github-social/"
          fi
